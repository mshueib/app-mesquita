name: azan_player
description: "Toca o Azan num serviço Android em primeiro plano, agendado por alarmes exactos."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.mosque.now.azan_player
        pluginClass: AzanPlayerPlugin
