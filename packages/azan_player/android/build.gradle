group 'com.mosque.now.azan_player'
version '1.0'

// Sem buildscript próprio: o Android Gradle Plugin e o Kotlin vêm das
// versões declaradas em android/settings.gradle.kts da app.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mosque.now.azan_player'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 24
    }
}
